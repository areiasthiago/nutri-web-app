    <path fill="#409828" d="M435,333 C451,309 471,300 481,306 C473,328 453,336 435,333 Z" />
    <path fill="#409828" d="M549,322 C529,302 527,265 548,238 C567,265 567,302 549,322 Z" />
    <path fill="#409828" d="M558,327 C575,292 610,265 647,269 C632,302 601,324 558,327 Z" />
